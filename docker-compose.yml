x-torch-build: &torch-build
  context: .
  args:
    TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    TORCH_PACKAGE: ${TORCH_PACKAGE:-torch==2.12.0+cpu}

services:
  db:
    image: pgvector/pgvector:pg17 # antes: ankane/pgvector:latest (sin mantenimiento activo, tag flotante)
    container_name: pipeline_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      <<: *torch-build
    container_name: pipeline_migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env

  api:
    build:
      <<: *torch-build
    container_name: pipeline_api
    command:
      ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      HF_HOME: /app/hf_cache # caché de HuggingFace (modelo de embeddings) persistente
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ${HF_HOME:-./data/hf_cache}:/app/hf_cache # cache HF montado desde la variable de entorno del sistema

  agent_worker:
    build:
      <<: *torch-build
    container_name: pipeline_agents
    command: ["python", "-m", "src.events.listener"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      HF_HOME: /app/hf_cache # caché de HuggingFace (modelo de embeddings) persistente
    volumes:
      - ./data:/app/data
      - ${HF_HOME:-./data/hf_cache}:/app/hf_cache # cache HF montado desde la variable de entorno del sistema

volumes:
  pgdata:
